name: Compiler Halo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.HALO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Le secret HALO_KEYSTORE_B64 n'est pas configuré (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/halo.jks"

      - name: Compiler l'APK
        env:
          HALO_KEYSTORE: ${{ runner.temp }}/halo.jks
          HALO_KS_PASS: HaloNarbonne2026
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk halo.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Halo 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: halo.apk
          make_latest: true
