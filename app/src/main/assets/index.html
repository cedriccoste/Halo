<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halo</title>
<style>
:root{--bg:#000;--s1:#17171a;--s2:#26262b;--line:rgba(255,255,255,.09);--txt:#f4f2ee;--mut:#9a9aa2;--acc:#ffcf6b;--acc2:#fff1cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px;flex:none}
.bar h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0;flex:1;display:flex;align-items:center;gap:10px}
.halo{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle,transparent 52%,var(--acc2) 56%,var(--acc) 68%,transparent 72%);filter:drop-shadow(0 0 6px rgba(255,207,107,.7))}
.bar .sp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-align:center;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.btn{padding:9px 16px;border-radius:999px;background:var(--s2);font-weight:550;white-space:nowrap;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--acc);color:#1a1300;font-weight:650}
.btn.ghost{background:transparent;color:var(--txt);padding-left:6px}
.btn:disabled{opacity:.4}
#kinds{display:flex;align-self:flex-start;gap:2px;margin:0 14px 6px;padding:4px;background:var(--s1);border-radius:999px;flex:none}
#kinds button{font-size:14px;color:var(--mut);padding:7px 20px;border-radius:999px;font-weight:500}
#kinds button.on{color:var(--txt);background:var(--s2);font-weight:600}
#vjob{display:block;margin:2px 12px 8px;padding:11px 16px;border-radius:14px;background:var(--s1);border:1px solid rgba(255,207,107,.3);color:var(--acc);font-weight:550;text-align:left;font-variant-numeric:tabular-nums;flex:none}
.cell .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);font-size:11px;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
#vid{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#vbar{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#vbar .ico{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%;flex:none;background:var(--acc);color:#1a1300}
#vbar .ico svg{width:20px;height:20px;fill:currentColor}
#vbar .rng{flex:1;min-width:60px;width:auto;margin:0}
#vTime{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.isvid [data-k=definition],.isvid [data-k=noise],.isvid #btnZone,.isvid #tabs [data-tab=pCrop]{display:none}
#busyBg{margin-top:10px}
#busyTxt{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
#btnSettings{padding:9px 11px;display:grid;place-items:center}
#btnSettings svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;display:block}
.note{font-size:13px;color:var(--mut);margin:10px 2px 0}
/* galerie */
#gallery>.bar{background:rgba(0,0,0,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#gScroll{flex:1;overflow:auto;padding:0 12px 110px}
.day{display:flex;align-items:baseline;justify-content:space-between;padding:22px 4px 10px;font-size:17px;font-weight:600}
.day span::first-letter{text-transform:uppercase}
.day button{color:var(--acc);font-weight:500;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:5px}
.cell{position:relative;aspect-ratio:1;background:var(--s1);overflow:hidden;border-radius:12px;transition:transform .15s}
.cell img,.cell canvas{width:100%;height:100%;object-fit:cover;display:block}
.cell .chk{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.2)}
.cell.sel{transform:scale(.93)}
.cell.sel::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2.5px var(--acc)}
.cell.sel .chk{background:var(--acc);border-color:var(--acc)}
.cell.sel .chk::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #1a1300;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cell .done{position:absolute;left:6px;bottom:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#1a1300;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cell .done svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.empty{padding:56px 28px;text-align:center;color:var(--mut)}
.empty .btn{margin-top:18px;display:inline-block}
#selBar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(38,38,43,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 20px;min-height:0;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#selBar span{flex:1;font-weight:550}
#btnSelMenu{letter-spacing:1px;padding:9px 18px}
.cell{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.cell img{pointer-events:none}
#days:not(.selmode) .chk{display:none}
.mitem:disabled{opacity:.35}
#selBar .btn:not(.primary){background:transparent;color:var(--mut)}
#upd{margin:4px 12px 6px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#2a2210,#1c1a14);border:1px solid rgba(255,207,107,.25);display:flex;flex-direction:column;gap:10px}
#upd div{min-width:0}#upd b{color:var(--acc);display:block}#upd small{color:#cfc8b4;display:block;white-space:pre-line;overflow-wrap:anywhere;max-height:84px;overflow:hidden}
#upd .btn{align-self:stretch;padding:11px}
#ver{font-size:12px;color:var(--mut);font-weight:400;letter-spacing:0}
/* éditeur */
#editor>.bar{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none;padding-bottom:22px}
#editor>.bar .btn{pointer-events:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#editor>.bar .btn.ghost{background:rgba(30,30,34,.55);padding-left:14px}
#editor>.bar .sp{color:var(--txt);text-shadow:0 1px 4px rgba(0,0,0,.8)}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:120px;touch-action:none}
#view{display:block;transform-origin:center;will-change:transform}
#row{display:flex;align-items:center;gap:6px;padding:8px 12px 2px;flex:none}
#row .btn{font-size:13px;padding:8px 13px;flex:none}
#row .btn.acc{background:rgba(255,207,107,.14);color:var(--acc);font-weight:600}
#btnMore2{background:var(--s1);letter-spacing:1px}
.mitem{display:block;width:100%;text-align:left;padding:15px 6px;border-bottom:1px solid var(--line);font-size:16px}
#badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(10px);padding:5px 12px;border-radius:999px;font-size:12px;color:var(--txt)}
#strip{display:flex;gap:6px;overflow-x:auto;padding:4px 3px;flex:1;min-width:0;scrollbar-width:none}
#strip::-webkit-scrollbar,#actions::-webkit-scrollbar,.tools::-webkit-scrollbar,.filters::-webkit-scrollbar,.crow::-webkit-scrollbar{display:none}
.sth{position:relative;flex:none;width:38px;height:38px;border-radius:9px;overflow:hidden;opacity:.5;transition:opacity .15s,transform .15s}
.sth.on{opacity:1;transform:scale(1.08);box-shadow:0 0 0 2px var(--acc)}
.sth canvas{width:100%;height:100%;object-fit:cover;display:block}
.sth i{position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
#actions{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 4px;flex:none;scrollbar-width:none}
#actions .btn{font-size:13px;padding:7px 13px;background:var(--s1);color:#d6d4cf;font-weight:500}
#actions .btn.acc{background:rgba(255,207,107,.14);color:var(--acc);font-weight:600}
.pane{flex:none;padding:2px 0 6px}
#adjHead{position:relative;display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;color:var(--mut);height:30px}
#btnZone{position:absolute;left:12px;top:0;padding:5px 12px 5px 26px;font-size:13px}
#btnZone::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-6px;border-radius:50%;border:1.5px dashed currentColor}
#zoneBar{display:flex;align-items:center;gap:6px;padding:4px 12px 6px;overflow-x:auto;scrollbar-width:none}
#zoneBar::-webkit-scrollbar{display:none}
#zoneBar .ico{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:50%}
#zoneBar .ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#zoneBar .rng{flex:1;min-width:70px;width:auto;margin:0 6px}
#brushRing{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
#adjHead b{color:var(--acc);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
#adjPill{font:inherit}
.sr{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
#adjPill{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--mut);padding:4px 10px;border-radius:999px}
#btnFs{padding:8px 10px!important;display:grid;place-items:center}
#btnFs svg,#btnFsExit svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#btnFsExit{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:7;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,24,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
#histBtns{position:absolute;z-index:7;top:9px;left:60px;display:flex;gap:6px}
#histBtns button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(30,30,34,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;transition:opacity .15s}
#histBtns button:disabled{opacity:.3}
#histBtns svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
#editor>.bar #btnBack{margin-right:86px;width:38px;height:38px;padding:0;display:grid;place-items:center;flex:none}
#btnBack svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#editor>.bar{gap:8px;padding-left:14px;padding-right:14px}
#editor>.bar .btn{flex:none}
.fs #histBtns{left:auto;right:62px;top:calc(13px + env(safe-area-inset-top))}
/* plein écran : la photo prend tout l'écran, les réglages flottent par-dessus */
.fs>.bar,.fs #tabs,.fs:not(.isvid) #row{display:none}
.fs.isvid #row{position:absolute;left:0;right:60px;top:calc(8px + env(safe-area-inset-top));z-index:6}
.fs.isvid #row #btnMore2{display:none}
.fs.isvid #vbar{background:rgba(20,20,24,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:4px 14px 4px 4px}
.fs .pane{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:26px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.5))}
.fs #adjHead{justify-content:flex-start;padding:0 12px;height:36px;gap:8px}
.fs #btnZone{position:relative;left:0;background:rgba(20,20,24,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fs #btnZone.on{background:var(--acc)}
.fs #adjPill{order:-1;background:rgba(20,20,24,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:7px 14px;color:#fff;font-size:14px}
.fs #adjPill::after{content:"";width:7px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(-135deg) translate(-2px,-2px);margin-left:4px;opacity:.8}
.fs.showtools #adjPill::after{transform:rotate(45deg) translate(-2px,-2px)}
.fs #dial{opacity:.9}
.fs .tools{display:none}
.fs.showtools .tools{display:flex;margin:6px 8px 0;padding:10px 8px 4px;border-radius:22px;background:rgba(20,20,24,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.fs .tool .ring::before{background:rgba(0,0,0,.55)}
.fs .tool small{color:#e8e6e1}
.fs #zoneBar .chip,.fs .crow .chip{background:rgba(20,20,24,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fs #zoneBar .chip.on,.fs .crow .chip.on{background:var(--acc)}
.fs .fltHead,.fs .slrow label,.fs .slrow output{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
/* molette */
#dial{position:relative;height:46px;overflow:hidden;touch-action:none;cursor:ew-resize;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
#dialTicks{position:absolute;left:50%;top:0;bottom:0;will-change:transform}
#dialTicks::before,#dialTicks::after{content:"";position:absolute;left:0;right:0;bottom:10px}
#dialTicks::before{height:9px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 1px,transparent 1px 8px)}
#dialTicks::after{height:16px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 1px,transparent 1px 40px)}
#dialZero{position:absolute;top:6px;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:#fff}
#dialMark{position:absolute;left:50%;bottom:8px;width:2px;height:26px;margin-left:-.5px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px rgba(255,207,107,.8)}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scroll-snap-type:x proximity;scrollbar-width:none}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;scroll-snap-align:center}
.tool .ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;position:relative;color:#d6d4cf;background:conic-gradient(from var(--from,0deg),var(--acc) var(--a,0deg),rgba(255,255,255,.14) 0)}
.tool .ring::before{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--bg)}
.tool .ring>span{position:relative;grid-area:1/1;display:grid;place-items:center}
.tool svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool svg .f{fill:currentColor;stroke:none}
.tool .ring>.num{display:none;font-size:15px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums}
.tool small{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.15;height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px}
.tool.on .ring::before{background:var(--s1)}
.tool.on small{color:var(--txt)}
.tool.on:not(.auto) .ring>.ic{display:none}.tool.on:not(.auto) .ring>.num{display:grid}
.tool.auto.active .ring{color:#1a1300;background:var(--acc);box-shadow:0 0 16px rgba(255,207,107,.45)}
.tool.auto.active .ring::before{background:linear-gradient(135deg,var(--acc2),var(--acc))}
.filters{display:flex;gap:10px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none}
.flt{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.flt canvas{width:66px;height:66px;border-radius:12px;display:block;background:var(--s1)}
.flt.on{color:var(--txt)}.flt.on canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.rng{-webkit-appearance:none;appearance:none;display:block;width:calc(100% - 44px);margin:10px 22px 8px;height:28px;background:transparent}
.rng::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.2)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9.5px;border-radius:50%;background:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.fltHead{text-align:center;font-size:13px;color:var(--mut);height:20px}.fltHead b{color:var(--acc)}
.crow{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 4px;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--s1);font-size:13px;color:#d6d4cf}
.chip.on{background:var(--acc);color:#1a1300;font-weight:600}
.slrow{display:flex;align-items:center;gap:8px;padding:0 16px}
.slrow label{width:78px;font-size:13px;color:var(--mut)}
.slrow .rng{margin:2px 0;flex:1;width:auto}
.slrow output{width:34px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
#tabs{display:flex;align-self:center;gap:2px;margin:6px 0 calc(12px + env(safe-area-inset-bottom));padding:4px;flex:none;background:var(--s1);border-radius:999px}
#tabs button{font-size:14px;color:var(--mut);padding:8px 18px;border-radius:999px;font-weight:500;transition:background .15s,color .15s}
#tabs button.on{color:var(--txt);background:var(--s2);font-weight:600}
/* feuilles & overlay */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
#sheet{width:100%;max-height:85%;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
#sheet::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#sheet h2{font-size:20px;letter-spacing:-.01em;margin:0 0 6px}
#sheet p{color:var(--mut);margin:6px 0 12px;font-size:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--s2);margin:8px 0}
.opt input{margin-top:3px;accent-color:var(--acc);width:18px;height:18px}
.opt b{display:block}.opt small{color:var(--mut)}
.srow{display:flex;gap:10px;margin-top:14px}.srow .btn{flex:1;padding:13px}
.bitem{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.bitem input{accent-color:var(--acc);width:18px;height:18px}
.bitem span{flex:1;font-size:14px}.bitem small{color:var(--mut)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#busy .bar2{width:62%;height:4px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#busy .bar2 i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#toast{position:fixed;white-space:pre-line;line-height:1.35;left:50%;top:68px;transform:translateX(-50%);background:rgba(38,38,43,.92);backdrop-filter:blur(14px);border:1px solid var(--line);padding:10px 18px;border-radius:20px;z-index:40;font-size:14px;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>

<section id="gallery" class="view">
  <header class="bar"><h1><i class="halo"></i>Halo<span id="ver"></span></h1><button class="btn" id="btnBackups" hidden>Restaurer</button><button class="btn" id="btnSettings" aria-label="Réglages"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></button></header>
  <div id="kinds"><button data-kind="photo" class="on">Photos</button><button data-kind="video">Vidéos</button></div>
  <button id="vjob" hidden></button>
  <div id="upd" hidden><div><b id="updTitle"></b><small id="updNotes"></small></div><button class="btn primary" id="btnUpd">Installer</button></div>
  <div id="gScroll">
    <div id="permBox" class="empty" hidden>
      <p>L'appli a besoin d'accéder à tes photos pour les retoucher, et à leur emplacement pour le conserver.</p>
      <button class="btn primary" id="btnPerm">Autoriser l'accès</button>
    </div>
    <div id="webPick" class="empty" hidden>
      <p>Choisis les photos d'un même bien.</p>
      <label class="btn primary">Choisir des photos<input type="file" id="fileInput" multiple accept="image/*" hidden></label>
    </div>

  { k: 'vividWarm', n: 'Vif chaud', d: { saturation: 22, vibrance: 18, contrast: 15, warmth: 22 } },
  { k: 'vividCool', n: 'Vif froid', d: { saturation: 22, vibrance: 18, contrast: 15, warmth: -22 } },
  { k: 'dramatic', n: 'Spectaculaire', d: { contrast: 35, saturation: -20, shadows: -15, highlights: -20, blackpoint: 10 } },
  { k: 'dramaticWarm', n: 'Spect. chaud', d: { contrast: 35, saturation: -15, shadows: -15, highlights: -20, blackpoint: 10, warmth: 25 } },
  { k: 'dramaticCool', n: 'Spect. froid', d: { contrast: 35, saturation: -15, shadows: -15, highlights: -20, blackpoint: 10, warmth: -25 } },

const newSettings = () => ({ auto: null, adj: Object.fromEntries(ADJ_KEYS.map(k => [k, 0])), filter: 'none', filterAmt: 100 });
const newGeo = () => ({ rot: 0, straighten: 0, vertical: 0, horizontal: 0, crop: 'orig' });

// zone peinte d'une photo, à passer au moteur de rendu
function zoneOf(R, p, show) {

  R.setMask(p.mask.cv, p.id + ':' + p.mask.ver);

/* ---------- Analyse « Auto » (par photo) ---------- */
function analyzeAuto(bmp) {
  const W = 192, H = Math.max(1, Math.round(W * bmp.height / bmp.width));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(bmp, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data, n = W * H;
  const hist = new Uint32Array(256); let clip = 0;
  let sr = 0, sg = 0, sb = 0, cnt = 0, ar = 0, ag = 0, ab = 0;
  const lin = v => Math.pow(v / 255, 2.2);
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    hist[L | 0]++; if (L > 250) clip++;
    const R = lin(r), G = lin(g), B = lin(b);
    ar += R; ag += G; ab += B;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (L > 60 && L < 240 && (mx - mn) < 22) { sr += R; sg += G; sb += B; cnt++; }
  }
  const pct = p => { let t = p * n, a = 0; for (let i = 0; i < 256; i++) { a += hist[i]; if (a >= t) return i / 255; } return 1; };
  const p01 = pct(.01), p05 = pct(.05), p50 = pct(.5), p75 = pct(.75), p95 = pct(.95), p99 = pct(.99);
  const clipF = clip / n;
  const o = Object.fromEntries(ADJ_KEYS.map(k => [k, 0]));
  // Principe : le réglage de base ne doit jamais rendre la photo plus sombre qu'à l'origine.
  // exposition : on éclaircit les photos sombres ; une photo déjà claire est laissée telle quelle
  // On mesure trois niveaux (tons moyens, tons clairs, zones les plus claires) et on retient le plus prudent :
  // une photo au fond sombre mais au sujet bien exposé (portrait, intérieur avec fenêtre) n'est pas surexposée.
  const g = (target, v) => 2.2 * Math.log2(target / Math.max(v, 0.02));
  let ev = Math.min(g(0.54, p50), g(0.70, p75), g(0.90, p95));
  if (ev > 0) ev = Math.min(ev * 0.62, 1.1);
  else ev = p50 > 0.74 ? Math.max(ev * 0.25, -0.12) : 0;               // on ne fonce que si la photo est vraiment surexposée
  o.exposure = Math.round(ev / 2 * 100);
  // ombres : on les débouche
  if (p05 < 0.16) o.shadows = Math.round(clamp((0.16 - p05) / 0.16 * 24 + 6, 0, 30));
  // hautes lumières : on ne les retient que s'il y a des zones brûlées (fenêtres, ciel), et modérément
  if (clipF > 0.004 || p99 > 0.985) o.highlights = -Math.round(clamp(8 + clipF * 160, 0, 28));
  // brillance + un peu de luminosité : donne de l'éclat sans ternir les murs clairs
  const head = clamp((0.92 - p95) / 0.3, 0, 1);                        // marge restante dans les clairs
  o.brilliance = 14;
  o.brightness = Math.round(2 + 6 * head);
  // contraste & point noir
  const spread = p95 - p05;
  if (spread < 0.65) o.contrast = Math.round(clamp((0.65 - spread) * 55, 0, 22));
  else if (spread > 0.92) o.contrast = -6;
  if (p01 > 0.06) o.blackpoint = Math.round(clamp((p01 - 0.03) * 110, 0, 12));
  // balance des blancs (sur les zones presque neutres, sinon moyenne globale)
  let R = sr, G = sg, B = sb;
  // prudence : sans assez de zones neutres (murs blancs, plafonds), on ne touche pas aux couleurs
  if (cnt >= n * 0.04 && R > 0 && G > 0 && B > 0) {
    const rb = Math.log(R / B) - 0.03;           // garde une légère chaleur
    o.warmth = Math.round(clamp(-rb / 0.405 * 100 * 0.35, -14, 14));
    const gc = Math.log(G / Math.sqrt(R * B));
    o.tint = Math.round(clamp(gc / 0.1625 * 100 * 0.35, -12, 12));

  return {
    B: o,
    dark: clamp((0.25 - p05) / 0.25 * 0.6 + (0.45 - p50) / 0.45 * 0.6, 0, 1),   // photo sombre / ombres bouchées
    hot: clamp((p99 - 0.85) / 0.15 * 0.6 + clipF * 12, 0, 1),                    // fenêtres, ciel brûlé
    room: clamp(1 - clipF * 25, 0.3, 1) * (p95 < 0.9 ? 1 : 0.6),                 // marge avant de brûler les blancs
  };
}

/* ---------- Réglages effectifs (auto + manuel + filtre) ---------- */
// Auto : null = désactivé, sinon position du curseur 0–100 (50 = réglage conseillé).
// Chaque réglage suit sa propre courbe, adaptée au profil de la photo : vers la droite,
// l'image s'ouvre (exposition, ombres, brillance) pendant que les hautes lumières et le
// contraste baissent et que le point noir remonte ; vers la gauche, rendu plus dense.
const autoOn = s => !!s && s.auto != null && s.auto !== false;

function normSettings(s) { if (s && (s.auto === 0 || s.auto === false || s.auto === undefined)) s.auto = null; if (s && s.auto === true) s.auto = 50; return s; }
function autoValues(A, pos) {
  const u = (pos - 50) / 50, ease = x => x * (0.55 + 0.45 * x);
  const U = ease(Math.max(0, u)), D = ease(Math.max(0, -u));
  const B = A.B, o = Object.assign({}, B);
  o.exposure   += U * 16 * A.room            - D * 20;
  o.brilliance += U * 32                     - D * 24;
  o.highlights += -U * (12 + 26 * A.hot)     + D * 14;
  o.shadows    += U * (12 + 30 * A.dark)     - D * (8 + 16 * (1 - A.dark));
  o.contrast   += -U * (6 + 6 * A.dark)      + D * 18;
  o.brightness += U * 10                     - D * 6;
  o.blackpoint += U * (8 + 8 * A.dark)       + D * 8;
  o.saturation += U * 8                      - D * 10;
  o.vibrance   += U * 18                     - D * 5;
  o.warmth     += U * 4                      - D * 3;
  o.definition += U * 10                     + D * 6;

}
function autoPart(p, s, k) {
  if (!autoOn(s)) return 0;
  if (!p.auto && p.thumb) p.auto = analyzeAuto(p.thumb);
  return p.auto ? autoValues(p.auto, autoPos(s))[k] : 0;
}
const shownVal = (p, s, k) => clamp(s.adj[k] + autoPart(p, s, k), MINV(k), 100);
function effective(p, opts = {}) {
  const s = p.settings || newSettings();
  const e = { mono: 0 };
  const f = FILTERS.find(f => f.k === (opts.filter ?? s.filter)) || FILTERS[0];
  const amt = (opts.filterAmt ?? s.filterAmt) / 100;
  for (const k of ADJ_KEYS) {
    const v = shownVal(p, s, k) + (f.d[k] || 0) * amt;
    e[k] = clamp(v, MINV(k), 100);
  }
  e.mono = (f.d.mono || 0) * amt;
  if (p.kind === 'video') { e.definition = 0; e.noise = 0; }   // non disponibles en vidéo
  return e;
}

/* ---------- Géométrie ---------- */
function geomFor(srcW, srcH, g) {
  const rot = ((g.rot % 4) + 4) % 4;
  const rw = rot % 2 ? srcH : srcW, rh = rot % 2 ? srcW : srcH;
  const Aasp = rw / rh;
  let cw = Aasp, ch = 1;
  if (g.crop !== 'orig') {
    const [a, b] = g.crop.split(':').map(Number);
    let r = a / b; r = Aasp >= 1 ? Math.max(r, 1 / r) : Math.min(r, 1 / r);
    if (r < Aasp) { cw = r; ch = 1; } else { cw = Aasp; ch = Aasp / r; }
  }
  const ang = g.straighten * Math.PI / 180, ve = g.vertical / 100 * 0.8, ho = g.horizontal / 100 * 0.8;
  const map = (u, v, z) => {
    let x = (u - .5) * cw / z, y = (v - .5) * ch / z;
    const c = Math.cos(ang), s = Math.sin(ang);
    let qx = c * x - s * y, qy = s * x + c * y;
    qx *= 1 + ve * qy; qy *= 1 + ho * qx / Aasp;
    return [qx / Aasp + .5, qy + .5];
  };
  const pts = [[0,0],[1,0],[0,1],[1,1],[.5,0],[.5,1],[0,.5],[1,.5]];
  const ok = z => pts.every(([u, v]) => { const [a, b] = map(u, v, z); return a >= -1e-4 && a <= 1 + 1e-4 && b >= -1e-4 && b <= 1 + 1e-4; });
  let zoom = 1;
  if (!ok(1)) { let lo = 1, hi = 1.2; while (!ok(hi) && hi < 8) { lo = hi; hi *= 1.3; } for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (ok(m)) hi = m; else lo = m; } zoom = hi; }
  const toSrc = (u, v) => { const [x, y] = map(u, v, zoom); return rot === 1 ? [y, 1 - x] : rot === 2 ? [1 - x, 1 - y] : rot === 3 ? [1 - y, x] : [x, y]; };
  return { rot, rw, rh, Aasp, cw, ch, ang, ve, ho, zoom, toSrc, outAspect: cw / ch,

}

/* ---------- Moteur WebGL ---------- */
const VS = `#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex;
uniform vec2 uTexel; uniform float uLodDef, uLodNR;

/* --- zone peinte : pinceau, gomme, inversion --- */
let zErase = false;
function ensureMask(p) {
  if (!p.mask) {
    const k = 768 / Math.max(RV.w, RV.h), cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(RV.w * k)); cv.height = Math.max(1, Math.round(RV.h * k));
    p.mask = { cv, inv: false, ver: 0 };

}
// position du doigt -> position dans la photo d'origine (suit zoom, recadrage, redressement)
function touchToSrc(x, y) {
  const r = $('view').getBoundingClientRect();
  return lastG.toSrc((x - r.left) / r.width, (y - r.top) / r.height);
}
function brushStamp(p, x, y) {
  const m = ensureMask(p), cv = m.cv, c = cv.getContext('2d');
  const [sx, sy] = touchToSrc(x, y);
  const rpx = $('stage').clientWidth * (+$('zSize').value) / 200;          // rayon à l'écran
  const [ex, ey] = touchToSrc(x + rpx, y);
  const R = Math.max(2, Math.hypot((ex - sx) * cv.width, (ey - sy) * cv.height));
  const cx = sx * cv.width, cy = sy * cv.height;
  const g = c.createRadialGradient(cx, cy, R * 0.45, cx, cy, R);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');

}
function brushLine(p, a, b) {
  const step = Math.max(2, $('stage').clientWidth * (+$('zSize').value) / 200 / 3);
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / step));
  for (let i = 1; i <= n; i++) brushStamp(p, a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n);
}
let ringT;
function showBrushRing() {
  const r = $('brushRing'), d = $('stage').clientWidth * (+$('zSize').value) / 100;
  r.style.width = r.style.height = d + 'px'; r.hidden = false;
  clearTimeout(ringT); ringT = setTimeout(() => r.hidden = true, 900);
}

/* --- gestes sur la photo : pincer = zoom, double-tap = zoom, glisser = déplacer, appui long = original --- */
const stage = $('stage');
const Z = { s: 1, x: 0, y: 0 };
function applyZ() {
  const cv = $('view');
  const mx = Math.max(0, (cv.offsetWidth * Z.s - stage.clientWidth) / 2), my = Math.max(0, (cv.offsetHeight * Z.s - stage.clientHeight) / 2);
  Z.x = clamp(Z.x, -mx, mx); Z.y = clamp(Z.y, -my, my);

}
function resetZ() { Z.s = 1; Z.x = 0; Z.y = 0; applyZ(); }
(() => {
  const pts = new Map(); let holdT = null, lastTap = 0, st = null, pinch = null;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  const stopHold = () => { clearTimeout(holdT); holdT = null; if (orig) { orig = false; drawView(); return true; } return false; };
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);

      st = { x: e.clientX, y: e.clientY, zx: Z.x, zy: Z.y, moved: false };
      if (S.zone && S.tab === 'pAdjust' && curP() && lastG) {           // un doigt = pinceau
        st.paint = true; st.last = { x: e.clientX, y: e.clientY };

    } else if (pts.size === 2) {

  let android = '';

    ? `<p class="note">Confirmation Android : désactivée, Halo modifie tes photos directement ✓</p>`
    : `<p class="note">Android demande une confirmation à chaque enregistrement.</p><div class="srow"><button class="btn" id="stMm">Autoriser une fois pour toutes</button></div>`;
  sheet(`<h2>Réglages</h2><p>À l'enregistrement</p>
    <label class="opt"><input type="radio" name="sm" value="replace" ${mode === 'replace' ? 'checked' : ''}><div><b>Remplacer les originales</b><small>Les originales sont gardées 30 jours (bouton « Restaurer »).</small></div></label>
    <label class="opt"><input type="radio" name="sm" value="copy" ${mode === 'copy' ? 'checked' : ''}><div><b>Enregistrer des copies</b><small>Dans le dossier Retouches. Les originales ne sont pas touchées.</small></div></label>
    <label class="opt"><input type="checkbox" id="stAsk" ${ask ? 'checked' : ''}><div><b>Me demander à chaque fois</b></div></label>
    ${android}
    <div class="srow"><button class="btn primary" id="stOk">OK</button></div>`);
  if ($('stMm')) $('stMm').onclick = () => { closeSheet(); A.openManageMedia(); };
  $('stOk').onclick = () => { LS.set('mode', $('sheet').querySelector('input[name=sm]:checked').value); LS.set('modeSet', !$('stAsk').checked); closeSheet(); };
};
// comme sur l'iPhone : une fois la photo enregistrée, on revient aux photos
$('btnSave').onclick = () => askSave(S.batch.filter(isEdited), ok => { if (ok && S.batch.length === 1) closeEditor(); });

// Pleine résolution, en trois temps pour pouvoir les faire se chevaucher d'une photo à l'autre :
// 1) décodage  2) rendu GPU (immédiat)  3) encodage JPEG (en tâche de fond)
function startDecode(p) {
  const pr = (async () => { const blob = await sourceBlob(p); return { blob, bmp: await decode(blob, Math.min(RE.maxTex, 8192)) }; })();
  pr.catch(() => {});
  return pr;
}
function renderDecoded(p, bmp) {
  if (autoOn(p.settings) && !p.auto) p.auto = analyzeAuto(p.thumb || bmp);
  const e = effective(p), z = hasZone(p) ? p.local : {};
  RE.setImage(bmp, !!(e.definition || e.noise || z.definition || z.noise));
  const G = geomFor(bmp.width, bmp.height, p.geo);
  RE.render(e, G, G.outW, G.outH, false, zoneOf(RE, p, false));
  const out = new Promise((res, rej) => RE.cv.toBlob(b => b ? res(b) : rej(new Error('encodage impossible')), 'image/jpeg', 0.95));
  RE.release(); bmp.close();
  return out;
}
async function renderFull(p) {
  const { blob, bmp } = await startDecode(p);
  return { out: await renderDecoded(p, bmp), srcBlob: blob };
}
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });

/* ---------- Vidéos : calcul en arrière-plan par l'appli Android, suivi en pourcentage ---------- */
let vTimer = null, vOverlay = false, vErrors = [];
async function saveVideos(list, mode) {
  if (!A) { toast("L'enregistrement des vidéos se fait dans l'appli Android", 3500); return false; }
  if (mode === 'replace') {
    busy(true, 'Confirmation Android…', 0);
    const ok = await askWrite(list.map(p => p.id));
    if (!ok) { busy(false); toast('Enregistrement annulé (autorisation refusée)'); return false; }
  }
  busy(true, 'Préparation…', 0);
  const jobs = [];
  for (const p of list) { try { await ensureThumb(p); } catch (e) {} jobs.push({ id: p.id, mode, e: effective(p) }); }
  const r = A.startVideoJobs(JSON.stringify(jobs));
  if (r !== 'ok') { busy(false); toast('Impossible de lancer le calcul : ' + String(r).replace(/^err:/, ''), 4000); return false; }
  for (const p of list) { p.pending = true; p.savedSig = sig(p); memSave(p, mode); }
  vOverlay = true; vErrors = []; pollVideo();
  return true;
}
function pollVideo() {
  clearTimeout(vTimer);
  let st; try { st = JSON.parse(A.videoStatus()); } catch (e) { return; }
  for (const j of st.jobs) {
    const p = S.all.get(j.id); if (!p || !p.pending) continue;
    if (j.state === 'ok') { p.pending = false; p.saved = true; p.v = Date.now(); if ((MEM[p.id] || {}).mode === 'replace') p.useBackup = true; }
    if (j.state === 'err') { p.pending = false; p.savedSig = undefined; memForget(p.id); vErrors.push(p.name + ' : ' + j.err); }
  }
  if (st.running) {
    const frac = st.total ? (st.index + st.percent / 100) / st.total : 0;
    const txt = (st.total > 1 ? `Vidéo ${st.index + 1} / ${st.total} — ` : 'Vidéo — ') + st.percent + ' %';
    if (vOverlay) { busy(true, txt, frac, st.name); $('busyBg').hidden = false; }
    $('vjob').hidden = vOverlay; $('vjob').textContent = txt + ' · calcul en cours';
    vTimer = setTimeout(pollVideo, 600);
  } else {
    if (vOverlay) busy(false);
    vOverlay = false; $('vjob').hidden = true;
    if (vErrors.length) sheet(`<h2>Vidéo non enregistrée</h2><p>${vErrors.map(x => x.replace(/</g, '&lt;')).join('<br>')}</p><div class="srow"><button class="btn primary" onclick="closeSheet()">OK</button></div>`);
    else if (st.total) toast(st.total > 1 ? st.total + ' vidéos enregistrées ✓' : 'Vidéo enregistrée ✓', 3500);
    vErrors = [];
    if (!$('gallery').hidden) renderGallery();
  }
}
$('busyBg').onclick = () => { vOverlay = false; busy(false); $('vjob').hidden = false; toast('Le calcul continue. Tu peux quitter Halo : suis-le dans les notifications.', 4000); };
$('vjob').onclick = () => { vOverlay = true; pollVideo(); };

/* ---------- Écriture d'une photo retouchée ---------- */
const binWait = new Map(); let binBroken = false;
if (window.HaloBin) HaloBin.onmessage = e => { const m = String(e.data), k = m.indexOf('|'), id = m.slice(0, k), r = binWait.get(id); binWait.delete(id); if (r) r(m.slice(k + 1)); };
// envoi à Android : octets bruts si possible (rapide), sinon ancien envoi en texte
async function nativeSave(p, blob, mode) {
  if (window.HaloBin && !binBroken && A.binSupported && A.binSupported()) {
    try {
      const buf = await blob.arrayBuffer();
      return await new Promise((res, rej) => {
        const t = setTimeout(() => { binWait.delete(p.id); rej(new Error('délai')); }, 45000);
        binWait.set(p.id, r => { clearTimeout(t); res(r); });
        A.beginSave(p.id, mode); HaloBin.postMessage(buf);
      });
    } catch (e) { console.warn('transfert rapide indisponible', e); binBroken = true; try { A.resetBin(); } catch (x) {} }
  }
  return A.saveImage(p.id, await blobToB64(blob), mode);
}
function markSaved(p, r) {
  if (!String(r).startsWith('ok')) throw new Error(String(r).replace(/^err:/, ''));
  if (r === 'ok') { p.useBackup = true; p.saved = true; p.v = Date.now(); memSave(p, 'replace'); if (backupIds) backupIds.add(p.id); }
  if (r === 'ok:copy') { p.saved = true; memSave(p, 'copy'); }
  p.savedSig = sig(p);
}
/* Moteur natif : Android décode, calcule sur la puce graphique et compresse lui-même la photo.
   Renvoie null si la photo n'est pas prise en charge (on repasse alors par l'ancien chemin). */
const nativeWait = new Map(); let nativeBroken = false, diag = null;
window.onNativeSave = (id, r) => { const f = nativeWait.get(id); nativeWait.delete(id); if (f) f(String(r)); };
async function nativeRenderSave(p, mode) {
  const [w, h] = String(A.imageSize(p.id)).split(',').map(Number);
  if (!(w > 0 && h > 0)) return null;
  try { await ensureThumb(p); } catch (e) {}
  if (autoOn(p.settings) && !p.auto) { if (!p.thumb) return null; p.auto = analyzeAuto(p.thumb); }
  const G = geomFor(w, h, p.geo), e = effective(p), z = hasZone(p);
  const loc = z ? { adj: p.local, inv: p.mask.inv, show: false } : null;
  const job = { id: p.id, mode, srcW: w, srcH: h, outW: G.outW, outH: G.outH, fs: FS,
    mip: !!(e.definition || e.noise || (z && (p.local.definition || p.local.noise))),
    plain: isDefaultGeo(p.geo) && !z && !e.vignette,     // permet au moteur de vérifier que l'image n'est pas retournée
    uniforms: uniformList(e, G, w, h, false, loc, z) };
  if (z) job.mask = p.mask.cv.toDataURL('image/png').split(',')[1];
  const r = await new Promise((res, rej) => {
    const t = setTimeout(() => { nativeWait.delete(p.id); rej(new Error('délai dépassé')); }, 60000);
    nativeWait.set(p.id, x => { clearTimeout(t); res(x); });
    const s = A.renderSave(JSON.stringify(job));
    if (s !== 'ok') { clearTimeout(t); nativeWait.delete(p.id); rej(new Error(s)); }
  });
  if (!r.startsWith('ok')) throw new Error(r.replace(/^err:/, ''));
  const [res, tm] = r.split('|');
  markSaved(p, res);
  for (const kv of (tm || '').split(',')) { const [k, v] = kv.split('='); if (k === 'px') diag.px = v; else if (k) diag[k] = (diag[k] || 0) + (+v || 0); }
  diag.n++;
  return res;
}
async function storeImage(p, out, srcBlob, mode) {
  if (A) {
    markSaved(p, await nativeSave(p, out, mode));
    return;
  } else {
    const withExif = await transplantExif(srcBlob, out);
    const a = document.createElement('a'); a.href = URL.createObjectURL(withExif);
    a.download = p.name.replace(/\.(heic|heif|png|webp)$/i, '.jpg'); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    p.saved = true;
  }
  p.savedSig = sig(p);
}

async function saveAll(list, mode) {
  if (isVid(list[0])) return saveVideos(list, mode);
  if (A && mode === 'replace') {
    busy(true, 'Confirmation Android…', 0);
    const ok = await askWrite(list.map(p => p.id));
    if (!ok) { busy(false); toast('Enregistrement annulé (autorisation refusée)'); return false; }
  }
  const errors = [], writes = [], t0 = performance.now();
  diag = { n: 0 };
  let done = 0, nextDec = null;
  const fail = (p, e) => { console.error(e); errors.push(p.name + ' : ' + (e.message || e)); };
  const show = () => busy(true, `Enregistrement ${Math.min(done + 1, list.length)} / ${list.length}`, done / list.length);
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    show(); await tick();
    if (A && A.renderSave && !nativeBroken) {
      try { if (await nativeRenderSave(p, mode)) { done++; continue; } }
      catch (e) { console.warn('moteur natif', e); nativeBroken = String(e.message || e); }   // on repasse par l'ancien chemin
    }
    try {
      const d = nextDec || startDecode(p); nextDec = null;
      const dec = await d;
      const blobP = renderDecoded(p, dec.bmp);
      if (i + 1 < list.length) nextDec = startDecode(list[i + 1]);      // la suivante se décode pendant l'encodage
      const out = await blobP;
      const w = storeImage(p, out, dec.blob, mode).catch(e => fail(p, e)).then(() => { done++; show(); });
      writes.push(w);
      if (writes.length >= 2) await writes[writes.length - 2];          // au plus deux écritures en attente
    } catch (e) { fail(p, e); done++; }
  }
  await Promise.all(writes);
  busy(false);
  const secs = Math.round((performance.now() - t0) / 100) / 10;
  if (errors.length) sheet(`<h2>${list.length - errors.length} enregistrée(s), ${errors.length} erreur(s)</h2><p>${errors.map(x => x.replace(/</g, '&lt;')).join('<br>')}</p><div class="srow"><button class="btn primary" onclick="closeSheet()">OK</button></div>`);
  else {
    const s1 = x => String(Math.round(x / 100) / 10).replace('.', ',') + ' s';
    let more = '';
    if (diag.n) more = `\n${diag.px} · lecture ${s1(diag.dec)} · calcul ${s1(diag.gl)} · compression ${s1(diag.jpg)} · écriture ${s1(diag.all - diag.dec - diag.gl - diag.jpg)}`;
    else if (nativeBroken) more = '\nMoteur de secours (' + nativeBroken + ')';
    toast(`${list.length} photo${list.length > 1 ? 's' : ''} enregistrée${list.length > 1 ? 's' : ''} en ${String(secs).replace('.', ',')} s ✓` + more, more ? 9000 : 3500);
  }
  return !errors.length;
}

/* ---------- EXIF (version navigateur) : recopie nom/date/GPS ---------- */
async function transplantExif(srcBlob, outBlob) {
  try {
    const src = new Uint8Array(await srcBlob.arrayBuffer());
    if (src[0] !== 0xFF || src[1] !== 0xD8) return outBlob;
    let i = 2, seg = null;
    while (i + 4 < src.length && src[i] === 0xFF) {
      const m = src[i + 1], len = (src[i + 2] << 8) | src[i + 3];
      if (m === 0xDA) break;
      if (m === 0xE1 && src[i + 4] === 0x45 && src[i + 5] === 0x78 && src[i + 6] === 0x69 && src[i + 7] === 0x66) { seg = src.slice(i, i + 2 + len); break; }
      i += 2 + len;
    }
    if (!seg) return outBlob;
    const T = 10, dv = new DataView(seg.buffer);
    const le = seg[T] === 0x49;
    const r16 = o => dv.getUint16(T + o, le), r32 = o => dv.getUint32(T + o, le);
    const ifd0 = r32(4), n = r16(ifd0);
    for (let k = 0; k < n; k++) { const e = ifd0 + 2 + k * 12; if (r16(e) === 0x0112) dv.setUint16(T + e + 8, 1, le); }
    dv.setUint32(T + ifd0 + 2 + n * 12, 0, le);   // supprime la miniature intégrée (ancienne image)
    const out = new Uint8Array(await outBlob.arrayBuffer());
    let j = 2; if (out[2] === 0xFF && out[3] === 0xE0) j = 4 + ((out[4] << 8) | out[5]);
    return new Blob([out.slice(0, 2), seg, out.slice(j)], { type: 'image/jpeg' });
  } catch (e) { console.warn('EXIF', e); return outBlob; }
}

/* ---------- Restaurer les originales (Android) ---------- */
$('btnBackups').onclick = () => {
  let list = []; try { list = JSON.parse(A.listBackups()); } catch (e) {}
  if (!list.length) return sheet(`<h2>Restaurer</h2><p>Aucune originale sauvegardée pour le moment. Elles sont gardées 30 jours après chaque remplacement.</p><div class="srow"><button class="btn primary" onclick="closeSheet()">OK</button></div>`);
  list.sort((a, b) => b.date - a.date);
  sheet(`<h2>Restaurer des originales</h2><p>Remet la photo d'origine à la place de la version retouchée.</p>
    <div>${list.map(b => `<label class="bitem"><input type="checkbox" value="${b.id}"><span>${b.name.replace(/</g, '&lt;')}</span><small>${new Date(b.date).toLocaleDateString('fr-FR')}</small></label>`).join('')}</div>
    <div class="srow"><button class="btn" onclick="closeSheet()">Annuler</button><button class="btn primary" id="rsGo">Restaurer</button></div>`);
  $('rsGo').onclick = async () => {
    const ids = [...$('sheet').querySelectorAll('input:checked')].map(x => x.value);
    if (!ids.length) return toast('Coche au moins une photo');
    closeSheet();
    await restoreIds(ids);
  };
};

/* ---------- Retour (bouton Android) ---------- */
window.appBack = () => {
  if (!$('busy').hidden) { if (vOverlay) $('busyBg').click(); return true; }
  if (!$('sheetWrap').hidden) { closeSheet(); return true; }
  if (!$('editor').hidden && $('editor').classList.contains('fs')) { setFs(false); return true; }
  if (!$('editor').hidden) { leaveEditor(); return true; }
  if (S.selMode) { $('btnClearSel').click(); return true; }
  return false;
};

/* ---------- Démarrage ---------- */
try {
  RV = new Renderer($('view')); RT = new Renderer($('glThumb')); RE = new Renderer($('glExport'));
} catch (e) {
  document.body.innerHTML = '<div class="empty">Impossible de démarrer le moteur graphique (WebGL2).<br>' + e.message + '</div>';
  throw e;
}
buildTools(); buildFilters(); buildCrop(); syncControls();
initGallery();
if (A && A.videoStatus) { try { if (JSON.parse(A.videoStatus()).running) pollVideo(); } catch (e) {} }

/* ---------- Mises à jour (GitHub) ---------- */
let updManual = false;
window.onUpdateInfo = info => {
  if (info && typeof info === 'object') {
    $('updTitle').textContent = 'Nouvelle version ' + info.version + ' disponible';
    $('updNotes').textContent = (info.notes || '').split('\n').filter(l => !/^(Co-Authored-By|Claude-Session)/.test(l)).join('\n').trim();
    $('btnUpd').textContent = 'Installer'; $('btnUpd').disabled = false;
    $('upd').hidden = false;
  } else if (updManual) {
    toast(info === false ? 'Halo est à jour (version ' + A.getVersion() + ')' : 'Impossible de vérifier les mises à jour (connexion ?)');
  }
  updManual = false;
};
window.onUpdateProgress = p => {
  const b = $('btnUpd');
  if (p === -2) { b.disabled = false; b.textContent = 'Installer'; toast("Autorise Halo à installer des applis, puis reviens et réappuie sur Installer", 5000); }
  else if (p === -1) { b.disabled = false; b.textContent = 'Réessayer'; toast('Le téléchargement a échoué'); }
  else if (p >= 1) { b.textContent = 'Installation…'; }
  else { b.disabled = true; b.textContent = Math.round(p * 100) + ' %'; }
};
$('btnUpd').onclick = () => { $('btnUpd').disabled = true; $('btnUpd').textContent = '0 %'; A.installUpdate(); };
$('ver').onclick = () => { if (!A) return; updManual = true; toast('Recherche de mise à jour…', 1500); A.checkUpdate(); };
if (A) { try { $('ver').textContent = 'v' + A.getVersion(); } catch (e) {} setTimeout(() => A.checkUpdate && A.checkUpdate(), 800); }
window.__RL = { S, effective, geomFor, analyzeAuto, renderFull, transplantExif, openEditor, selectPhoto };
</script>
